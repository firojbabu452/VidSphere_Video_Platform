apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vidsphere
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: backend=firojbabu452/vidsphere-backend,frontend=firojbabu452/vidsphere-frontend
    argocd-image-updater.argoproj.io/update-strategy: latest
spec:
  project: default
  source:
    repoURL: 'https://github.com/firojbabu452/VidSphere_Video_Platform.git'
    targetRevision: development
    path: argocd/k8s
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: vidsphere
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true





