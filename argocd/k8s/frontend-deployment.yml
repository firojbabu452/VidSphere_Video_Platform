apiVersion: apps/v1
kind: Deployment
metadata:
  name: vidsphere-frontend
  namespace: vidsphere 
  labels:
    app: vidsphere-frontend

spec:
  replicas: 3

  selector:
    matchLabels:
      app: vidsphere-frontend

  template:
    metadata:
      labels:
        app: vidsphere-frontend

    spec:
      containers:
        - name: frontend

          image: firojbabu452/vidsphere-frontend:6088d8361c61a82048a947e3e2f4512d2bef6f59
          imagePullPolicy: Always

          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "300m"
              memory: "256Mi"

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5