apiVersion: apps/v1
kind: Deployment
metadata:
  name: vidsphere-frontend
  namespace: vidsphere 
  labels:
    app: vidsphere-frontend

spec:
  replicas: 3

  selector:
    matchLabels:
      app: vidsphere-frontend

  template:
    metadata:
      labels:
        app: vidsphere-frontend

    spec:
      containers:
        - name: frontend

          image: firojbabu452/vidsphere-frontend:aad538fe52b9d95d13c9d8d9b002de14fd12bd4d
          imagePullPolicy: Always

          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "300m"
              memory: "256Mi"

          # livenessProbe:
          #   httpGet:
          #     path: /
          #     port: 80
          #   initialDelaySeconds: 20
          #   periodSeconds: 10

          # readinessProbe:
          #   httpGet:
          #     path: /
          #     port: 80
          #   initialDelaySeconds: 5
          #   periodSeconds: 5