apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vidsphere
  namespace: argocd
spec:
  project: default

  source:
    repoURL: 'https://github.com/firojbabu452/VidSphere_Video_Platform.git'
    targetRevision: development
    path: charts/vidsphere          # path to the Helm chart

    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml        # uncomment when needed
      # parameters:                 # optional override
      #   - name: backend.replicas
      #     value: "3"

  destination:
    server: https://kubernetes.default.svc
    namespace: vidsphere

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true