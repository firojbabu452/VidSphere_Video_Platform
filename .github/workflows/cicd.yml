name: Vidsphare cicd pipeline

on:
 push:
   branches:
     - main
     - development

jobs:
  cicd:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Backend Dependencies
        working-directory: ./Application-Code/backend
        run: npm install

      # - name: Run backend tests
      #   working-directory: ./Application-Code/backend
      #   run: npm test
    
      - name: Install Frontend Dependencies
        working-directory: ./Application-Code/frontend
        run: npm install

      # - name: Run Frontend Tests
      #   working-directory: ./Application-Code/frontend
      #   run: npm test

      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
      #login to docker hub
      - name: Log in Docker hub 
        uses: docker/login-action@v3
        with:
         username: ${{ secrets.DOCKER_USERNAME }}
         password: ${{ secrets.DOCKER_PASSWORD }}

      #backend image
      - name: Build backend  image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/vidsphere-backend:latest ./Application-Code/backend
      
      - name: Push backend image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/vidsphere-backend:latest

      #frontend image 

      - name: Build frontend  image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/vidsphere-frontend:latest ./Application-Code/frontend
      
      - name: Push frontend image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/vidsphere-frontend:latest
