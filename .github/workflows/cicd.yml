name: Vidsphare cicd pipeline

on:
 push:
   branches:
     - main
     - development
     
permissions:
  contents: write

jobs:
  cicd:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: install dependencies
        run: npm install 

      - name: Run tests
        run: npm test
    
      - name: Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: false
          scan-ref: .

      #login to docker hub
      - name: Log in Docker hub 
        uses: docker/login-action@v2
        with:
         username: ${{ secrets.DOCKER_USERNAME }}
         password: ${{ secrets.DOCKER_PASSWORD }}

      #backend image
      - name: Build backend  image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/vidsphere-backend:latest ./Application-code/backend
      
      - name: Push backend image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/vidsphere-backend:latest

      #frontend image 

      - name: Build frontend  image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/vidsphere-frontend:latest ./Application-code/frontend
      
      - name: Push frontend image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/vidsphere-frontend:latest
